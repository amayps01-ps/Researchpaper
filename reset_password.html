{% extends "base.html" %}
{% block title %}Reset Password – ResearchAI{% endblock %}
{% block content %}
<section class="auth-card">
  <span class="eyebrow">SECURE ACCOUNT RECOVERY</span>
  <h1>Create a new password</h1>
  <p class="muted">Choose a password with at least 8 characters.</p>
  <form method="POST">
    <label>New password</label>
    <input type="password" name="password" minlength="8" autocomplete="new-password" required>
    <label>Confirm new password</label>
    <input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required>
    <button class="button full" type="submit">Reset password</button>
  </form>
</section>
{% endblock %}
