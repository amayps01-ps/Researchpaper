{% extends "base.html" %}
{% block title %}Forgot Password – ResearchAI{% endblock %}
{% block content %}
<section class="auth-card">
  <span class="eyebrow">ACCOUNT RECOVERY</span>
  <h1>Forgot password?</h1>
  <p class="muted">Enter your registered email. If the account exists, we will send a secure reset link.</p>
  <form method="POST">
    <label>Registered email</label>
    <input type="email" name="email" placeholder="you@example.com" autocomplete="email" required>
    <button class="button full" type="submit">Send reset link</button>
  </form>
  <div class="auth-links"><a href="{{ url_for('login') }}">Back to login</a></div>
</section>
{% endblock %}
